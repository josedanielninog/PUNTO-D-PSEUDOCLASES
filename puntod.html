<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page Template</title>
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
  <header>
    <nav class="barra-nav">
      <div class="logo"></div>
      <ul class="menu">
        <li><a href="#">Home</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Appointment</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
      <div class="contacto">
        <span class="telefono">+57 301 5626475</span>
      </div>
    </nav>
  </header>


  <aside class="social-bar">
    <a href="#" class="icon casa"><i class="fa-solid fa-house"></i></a>
    <a href="#" class="icon facebook"><i class="fa-brands fa-facebook-f"></i></a>
    <a href="#" class="icon instagram"><i class="fa-brands fa-instagram"></i></a>
    <a href="#" class="icon youtube"><i class="fa-brands fa-youtube"></i></a>
    <a href="#" class="icon whatsapp"><i class="fa-brands fa-whatsapp"></i></a>
  </aside>

  <main class="seccion-principal">
    <div class="contenido">

      <div class="lado-izquierdo">
        <h1>Full Dedicated <br> To Your <span>Dental Health</span></h1>
        <p>
          Nuestro compromiso es cuidar tu sonrisa con profesionalismo,
          tecnología avanzada y atención personalizada.
        </p>
        <div class="botones">
          <button class="btn reservar">Book Now</button>
          <button class="btn info">Read More</button>
        </div>
      </div>


      <div class="lado-derecho">
        <h2>Book an Appointment</h2>
        <form class="formulario-cita">
          <div class="fila">
            <input type="text" placeholder="First Name" required>
            <input type="text" placeholder="Last Name" required>
          </div>
          <input type="email" placeholder="Your Email Address" required>
          <input type="text" placeholder="Contact No" required>
          <div class="fila">
            <input type="date" required>
            <input type="time" required>
          </div>

          <button type="submit" class="btn enviar">Book Now</button>
        </form>
      </div>

    </div>
  </main>

</body>

</html>
